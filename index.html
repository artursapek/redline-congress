<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RedlineCongress.org — Track Every Word Changed in U.S. Legislation</title>
    <meta
      name="description"
      content="Read and redline U.S. Congressional bills across every legislative stage. Powered by the Revise SDK."
    />
    <meta property="og:title" content="RedlineCongress.org" />
    <meta
      property="og:description"
      content="See exactly what changed in U.S. House and Senate bills at every step through Congress. Powered by the Revise SDK."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("rc-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          }
          // Diff style (Red/Green vs All red) also styles the redlined brand name.
          if (localStorage.getItem("rc-diff-style") === "word") {
            document.documentElement.setAttribute("data-diff-style", "word");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
